  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px 16px}
  .ctl{display:flex;align-items:center;gap:14px;margin-bottom:10px}

    border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit;font-weight:600;transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.play{width:46px;font-size:15px}
  .spd{display:flex;gap:4px}
  .spd button{padding:6px 9px;font-size:12px;font-weight:600}
  .spd button.on{background:var(--accent);color:#00121e;border-color:var(--accent)}
  .time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:96px}
  .time b{color:var(--txt)}
  .track{position:relative;height:26px;display:flex;align-items:center}
  input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--p,0%),#22303f var(--p,0%));

  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;

  .ticks i{position:absolute;top:3px;width:2px;height:8px;background:var(--danger);opacity:.55;border-radius:1px}
  .toggle{margin-left:auto;display:flex;gap:6px}

  .toggle button.off{opacity:.4}
  @media(max-width:720px){aside{display:none}}

,653],[524,634],[520,627],[563,562],[524,622],[520,630],[530,619],[522,636],[496,581],[479,569],[371,632],[352,720],[360,722],[356,714],[362,719],[356,718],[362,722],[358,721],[357,724],[318,560],[273,524],[272,522],[363,630],[355,614],[343,578],[427,569],[532,465],[531,472],[527,475],[522,471],[517,465],[515,463],[514,460],[512,458],[510,456],[508,454],[506,452],[504,450],[502,448],[501,445],[499,443],[497,441],[495,439],[493,437],[491,435],[489,433],[487,431],[484,429],[482,427],[480,425],[478,423],[475,422],[473,420],[470,418],[468,416],[466,414],[463,412],[459,409],[457,407],[455,405],[456,404],[461,401],[466,399],[468,397],[470,395],[473,393],[476,391],[478,389],[481,384],[479,379],[483,383],[487,385],[500,386],[505,385],[508,384],[511,383],[514,382],[519,380],[522,379],[524,377],[526,375],[528,373],[531,371],[529,373],[526,376],[521,379],[518,380],[515,381],[513,383],[507,385],[503,385],[496,385],[492,385],[485,387],[480,390],[477,392],[474,393],[472,395],[470,397],[468,399],[466,401],[461,405],[466,411],[470,414],[472,416],[475,418],[477,420],[479,422],[520,474],[533,467],[489,433],[467,398],[500,386],[508,385],[483,427],[397,596],[425,603],[436,607],[460,734],[476,729],[480,720],[480,695],[501,685],[453,699],[454,681],[380,634],[461,617],[461,609],[458,615],[459,609],[463,620],[462,612],[449,567],[457,569],[524,484],[568,585],[508,576],[471,568],[630,726],[627,724],[545,752],[572,785],[614,784],[661,698],[593,804],[588,809],[586,810],[662,634],[666,639],[636,647],[644,642],[633,649],[640,644],[631,652],[639,644],[605,751],[602,748],[599,746],[609,737],[644,707],[661,685],[615,733],[586,694],[657,678],[439,619],[497,566],[439,619],[649,749],[652,745],[652,740],[532,472],[490,380],[503,454],[508,466],[504,461],[524,484],[520,479],[490,607],[463,546],[465,557],[511,589],[480,570],[464,556],[463,548],[474,566]]};
const B = D.meta.bounds, DUR = D.meta.dur;
const PAL=["#4cc2ff","#ff7ab6","#ffd166","#8be34d","#c792ea","#ff9f5e","#5ee7d0","#f45b69",
           "#7aa2ff","#e0e0e0","#bb66ff","#00ffbb","#ffaa00","#00aaff"];
const teams=[...new Set(D.players.map(p=>p.team))].sort((a,b)=>a-b);
const teamColor={}; teams.forEach((t,i)=>teamColor[t]=PAL[i%PAL.length]);

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,pad=24, terrain=null;
const AR=(B.maxx-B.minx)/(B.maxy-B.miny);

function fit(){
  const st=document.getElementById('stage'), r=st.getBoundingClientRect();
  let w=r.width-32, h=r.height-32;
  if(w/h>AR){w=h*AR;}else{h=w/AR;}
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); W=w; H=h;
  buildTerrain();
}
function X(x){return pad+(x-B.minx)/(B.maxx-B.minx)*(W-2*pad);}
function Y(y){return pad+(1-(y-B.miny)/(B.maxy-B.miny))*(H-2*pad);}

function buildTerrain(){
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const c=off.getContext('2d');
  c.fillStyle='rgba(120,180,230,.05)';
  for(const p of D.density){c.beginPath();c.arc(X(p[0]),Y(p[1]),2.2,0,7);c.fill();}
  terrain=off;
}

function posAt(p,t){
  const path=p.path;
  if(!path.length) return null;
  if(t>p.deathT) return null;              // 실제 사망 후 = 숨김
  if(t<=path[0][0]) return [path[0][1],path[0][2]];   // 스폰 위치 유지
  const hi0=path.length-1;
  if(t>=path[hi0][0]) return [path[hi0][1],path[hi0][2]]; // 정지 = 마지막 위치 유지
  let lo=0,hi=hi0;
  while(lo<hi-1){const m=(lo+hi)>>1; if(path[m][0]<=t)lo=m;else hi=m;}
  const a=path[lo],b=path[hi],f=(t-a[0])/(b[0]-a[0]||1);
  return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function trailPts(path,t,win){
  const out=[]; for(const p of path){if(p[0]>t)break; if(p[0]>=t-win)out.push(p);} return out;
}

let show={trail:1,death:1,terr:1,name:0};
let time=0, playing=false, speed=2, last=null;

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#1e2a3a'; ctx.lineWidth=1; ctx.strokeRect(pad-6,pad-6,W-2*pad+12,H-2*pad+12);
  if(show.terr&&terrain) ctx.drawImage(terrain,0,0);
  const inB=(x,y)=>x>=B.minx&&x<=B.maxx&&y>=B.miny&&y<=B.maxy;
  if(show.trail){
    for(const p of D.players){
      const tp=trailPts(p.path,time,25).filter(q=>inB(q[1],q[2]));
      if(tp.length<2)continue;
      ctx.strokeStyle=teamColor[p.team]; ctx.globalAlpha=.35; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(X(tp[0][1]),Y(tp[0][2]));
      for(const q of tp)ctx.lineTo(X(q[1]),Y(q[2])); ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  if(show.death){
    for(const d of D.deaths){
      if(d.t>time)continue;
      const age=time-d.t, fade=Math.max(.25,1-age/60);
      const px=X(d.x),py=Y(d.y);
      ctx.globalAlpha=fade; ctx.strokeStyle='#ff5470'; ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px-4,py-4);ctx.lineTo(px+4,py+4);
      ctx.moveTo(px+4,py-4);ctx.lineTo(px-4,py+4);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  const alive=[];
  for(const p of D.players){
    const pos=posAt(p,time);
    if(!pos){continue;}
    alive.push(p.id);
    const bz=!inB(pos[0],pos[1]);   // 배틀존(본섬 밖) 체류
    const cx=Math.min(Math.max(pos[0],B.minx),B.maxx), cy=Math.min(Math.max(pos[1],B.miny),B.maxy);
    const px=X(cx),py=Y(cy),col=teamColor[p.team];
    if(bz){
      ctx.globalAlpha=.55;
      ctx.beginPath();ctx.arc(px,py,5,0,7);
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
      ctx.font='9px sans-serif'; ctx.fillStyle=col; ctx.textAlign='center';
      ctx.fillText('BZ',px,py+3);
      ctx.globalAlpha=1;
    }else{
      ctx.beginPath();ctx.arc(px,py,5,0,7);
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
      ctx.lineWidth=1.5; ctx.strokeStyle='#0a0e14'; ctx.stroke();
    }
    if(show.name){
      ctx.font='11px sans-serif'; ctx.fillStyle='#e6edf3'; ctx.textAlign='center';
      ctx.fillText(p.name.slice(0,8),px,py-9);
    }
  }
  updateRoster(alive);
}

function loop(ts){
  if(playing){
    if(last!=null){time+=(ts-last)/1000*speed; if(time>=DUR){time=DUR;playing=false;syncPlay();}}
    last=ts;
    seek.value=time/DUR*1000; setSeekFill();
    tnow.textContent=fmt(time);
  }else last=null;
  draw();
  requestAnimationFrame(loop);
}
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');}

const seek=document.getElementById('seek'),tnow=document.getElementById('tnow'),tend=document.getElementById('tend');
const playBtn=document.getElementById('play');
function setSeekFill(){seek.style.setProperty('--p',(seek.value/10)+'%');}
function syncPlay(){playBtn.innerHTML=playing?'&#10074;&#10074;':'&#9654;';}
playBtn.onclick=()=>{if(time>=DUR)time=0; playing=!playing; syncPlay();};
seek.oninput=()=>{time=seek.value/1000*DUR; tnow.textContent=fmt(time); setSeekFill();};

const spdWrap=document.getElementById('spd');
[1,2,4,8,16].forEach(s=>{const b=document.createElement('button');b.textContent=s+'x';
  if(s===speed)b.className='on'; b.onclick=()=>{speed=s;[...spdWrap.children].forEach(c=>c.classList.toggle('on',parseInt(c.textContent)===s));};
  spdWrap.appendChild(b);});

function tg(id,key){const b=document.getElementById(id);
  const upd=()=>b.classList.toggle('off',!show[key]);
  b.onclick=()=>{show[key]=!show[key];upd();}; upd();}
tg('tgTrail','trail');tg('tgDeath','death');tg('tgTerr','terr');tg('tgName','name');

const rosterEl=document.getElementById('roster');
const plRows={};
function buildRoster(){
  for(const t of teams){
    const box=document.createElement('div');box.className='team';
    const hd=document.createElement('div');hd.className='team-hd';
    hd.innerHTML='<span class="swatch" style="background:'+teamColor[t]+'"></span>&#54021; '+t;
    box.appendChild(hd);
    for(const p of D.players.filter(x=>x.team===t)){
      const row=document.createElement('div');row.className='pl';
      row.innerHTML='<span class="dot" style="background:'+teamColor[t]+';box-shadow:0 0 6px '+teamColor[t]+'"></span>'+p.name
        +'<span class="rank">#'+p.rank+'</span>';
      box.appendChild(row); plRows[p.id]=row;
    }
    rosterEl.appendChild(box);
  }
}
function updateRoster(alive){
  const set=new Set(alive);
  for(const p of D.players){const r=plRows[p.id];if(r)r.classList.toggle('dead',!set.has(p.id));}
}

document.getElementById('meta').innerHTML=
  '<span>&#44172;&#51076; <b>'+D.meta.gameId+'</b></span><span><b>'+D.meta.mode+'</b></span>'+
  '<span>&#54217;&#44508; MMR <b>'+D.meta.avgMMR+'</b></span><span>v'+D.meta.ver+'</span>'+
  '<span><b>'+D.players.length+'</b>&#47749; &#183; <b>'+D.deaths.length+'</b> &#45936;&#49828;</span>';
tend.textContent=fmt(DUR);
const ticks=document.getElementById('ticks');
for(const d of D.deaths){const i=document.createElement('i');i.style.left=(d.t/DUR*100)+'%';ticks.appendChild(i);}

buildRoster();
addEventListener('resize',fit); fit(); setSeekFill();
requestAnimationFrame(loop);
</script></body></html>
